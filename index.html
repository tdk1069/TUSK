<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MUD World Builder Pro v8.8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --bg: #0f0f0f; --panel: #1a1a1a; --accent: #4a90e2; --text: #e0e0e0; --border: #333; --danger: #c0392b; --success: #27ae60; --modal-bg: #222; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 380px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .tabs { display: flex; background: #111; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; color: #777; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: #1a1a1a; }
        .tab-content { padding: 15px; flex-grow: 1; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        /* General UI */
        label { display: block; font-size: 0.7rem; color: #888; margin-bottom: 4px; text-transform: uppercase; font-weight: 700; margin-top: 10px; }
        input, textarea, select { width: 100%; background: #000; color: #fff; border: 1px solid #444; padding: 8px; box-sizing: border-box; margin-bottom: 5px; border-radius: 4px; font-family: inherit; }
        button.action-btn { width:100%; padding: 8px; border:none; border-radius:4px; color:white; cursor:pointer; font-weight:bold; margin-top:5px; }
        .btn-green { background: var(--success); }
        .btn-blue { background: var(--accent); }
        .btn-red { background: var(--danger); }
        .btn-grey { background: #444; }
        .btn-sm { padding: 2px 8px; font-size: 0.75rem; width: auto; margin:0; }

        /* Lists */
        .list-item { background: #222; padding: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item:hover { background: #2a2a2a; }
        .list-item h4 { margin: 0; font-size: 0.9rem; color: #fff; pointer-events: none; }
        .list-item span { font-size: 0.75rem; color: #888; pointer-events: none; }
        
        /* Exits List */
        .exit-row { display: flex; justify-content: space-between; align-items: center; padding: 6px; background: #252525; border-bottom: 1px solid #333; font-size: 0.85rem; }
        .exit-dir { font-weight: bold; color: var(--accent); width: 40px; }
        .exit-dest { flex-grow: 1; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; }
        
        /* Modal */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        #modal-box { background: var(--modal-bg); width: 600px; max-height: 90vh; border: 1px solid #444; border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #modal-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; }
        #modal-body { padding: 20px; overflow-y: auto; }
        #modal-footer { padding: 15px; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; background: #1a1a1a; }

        /* Alignment Slider */
        .align-container { background: #111; padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 10px; border: 1px solid #333; }
        .align-val { color: var(--accent); font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 5px; }

        /* Map */
        #canvas-container { flex-grow: 1; position: relative; }
        canvas { display: block; }
        #compass-overlay { position: absolute; top: 20px; left: 400px; background: rgba(26,26,26,0.8); padding: 10px; border-radius: 8px; border: 1px solid var(--border); backdrop-filter: blur(4px); z-index: 5; }
        .compass-grid { display: grid; grid-template-columns: repeat(3, 35px); gap: 5px; }
        .dir-btn { width: 35px; height: 35px; background: #333; border: 1px solid #444; color: #fff; cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .dir-btn:hover { background: var(--accent); }
        .z-btns { display: flex; gap: 5px; margin-top: 8px; }
        .z-btn { flex: 1; padding: 5px; font-size: 10px; background: #222; border: 1px solid #444; color: white; cursor: pointer; }

        /* Tags */
        .tag-pill { background:#333; padding:2px 6px; border-radius:3px; margin-right:5px; margin-bottom:5px; font-size:0.8rem; border:1px solid #555; display:inline-block; }
        .tag-pill .remove { color:#c0392b; cursor:pointer; font-weight:bold; margin-left:4px; }
    </style>
</head>
<body>

<div id="modal-overlay">
    <div id="modal-box">
        <div id="modal-header">
            <h3 id="modal-title" style="margin:0">Edit</h3>
            <button onclick="closeModal()" style="background:none; border:none; color:#888; cursor:pointer; font-size:1.2rem;">&times;</button>
        </div>
        <div id="modal-body"></div>
        <div id="modal-footer">
            <button class="action-btn btn-grey" style="width:auto" onclick="closeModal()">Cancel</button>
            <button class="action-btn btn-green" style="width:auto" onclick="saveModal()">Save Changes</button>
        </div>
    </div>
</div>

<div id="compass-overlay">
    <div class="compass-grid">
        <button class="dir-btn" onclick="dig('nw')">NW</button>
        <button class="dir-btn" onclick="dig('n')">N</button>
        <button class="dir-btn" onclick="dig('ne')">NE</button>
        <button class="dir-btn" onclick="dig('w')">W</button>
        <div style="text-align:center; line-height:35px; color:#555">┼</div>
        <button class="dir-btn" onclick="dig('e')">E</button>
        <button class="dir-btn" onclick="dig('sw')">SW</button>
        <button class="dir-btn" onclick="dig('s')">S</button>
        <button class="dir-btn" onclick="dig('se')">SE</button>
    </div>
    <div class="z-btns">
        <button class="z-btn" onclick="dig('up')">UP ▲</button>
        <button class="z-btn" onclick="dig('down')">DWN ▼</button>
    </div>
    <div class="z-btns">
        <button class="z-btn" onclick="zoomOut()">ZOOM −</button>
        <button class="z-btn" onclick="zoomReset()" id="zoom-label">100%</button>
        <button class="z-btn" onclick="zoomIn()">ZOOM +</button>
    </div>
</div>

<div id="room-tooltip" style="display:none; position:fixed; background:rgba(26,26,26,0.95); border:1px solid #444; padding:6px 10px; border-radius:4px; font-size:0.8rem; pointer-events:none; z-index:20; color:#fff; max-width:220px;"></div>

<div id="sidebar">

        <button class="tab-btn active" onclick="showTab('basic')">Room</button>
        <button class="tab-btn" onclick="showTab('objects')">Obj</button>
        <button class="tab-btn" onclick="showTab('monsters')">Mon</button>
        <button class="tab-btn" onclick="showTab('file')">File</button>

            <option value="desert">Desert</option>
            <option value="swamp">Swamp</option>
            <option value="arctic">Arctic</option>
            <option value="ocean">Ocean</option>
            <option value="river">River</option>
            <option value="cave">Cave</option>
            <option value="road">Road</option>
            <option value="indoor">Indoor</option>
        </select>

        <label>Path</label>

            <option value="1">Major Road (large, horse-friendly)</option>
            <option value="2">Path (single horse)</option>

        <div style="display:flex; gap:10px;">

            <div style="flex:1"><label>Night Light (optional)</label><input type="text" id="r-nightlight" placeholder="unset" oninput="syncRoom()"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <div style="flex:1"><label>Combat Modifier %</label><input type="number" id="r-combatmod" oninput="syncRoom()"></div>
            <div style="flex:1"><label>Ceiling Height (in)</label><input type="number" id="r-height" placeholder="0 = unset" oninput="syncRoom()"></div>
        </div>
        <label style="display:flex; align-items:center; gap:6px; margin-top:10px;"><input type="checkbox" id="r-nopick" style="width:auto; margin:0;" onchange="syncRoom()"> Doors Unpickable (applies to all doors in room)</label>
        <div id="nopick-msg-row" style="display:none; margin-top:5px;"><input type="text" id="r-nopickmsg" placeholder="Custom fail message (optional)" oninput="syncRoom()"></div>

        <hr>
        <h3>Exits & Doors</h3>
        <div id="exit-list"></div>

        <hr>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Senses & Details</h3>
            <button class="action-btn btn-blue" style="width:auto; padding:5px 10px;" onclick="openDetailModal(-1)">+ Add</button>
        </div>
        <div id="detail-list" style="margin-top:10px;"></div>

        <hr>
        <h3>Special Room Features</h3>

        <hr>
        <div style="display:flex; gap:10px; margin-top:20px;">

            <button class="action-btn btn-red" onclick="deleteRoom()">Delete Room</button>

    </div>

    <div id="tab-objects" class="tab-content">

        </div>
        <div id="room-obj-list"></div>
        <hr>
        <div style="display:flex; justify-content:space-between; align-items:center;">

    </div>

            <button class="dir-btn" onclick="addMonToRoom()">+</button>
        </div>
        <div id="room-mon-list"></div>
        <hr>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Monster Library</h3>
            <button class="action-btn btn-blue" style="width:auto; padding:5px 10px;" onclick="openMonsterModal(-1)">+ New</button>
        </div>
        <div id="global-mon-list" style="margin-top:10px;"></div>
    </div>

    <div id="tab-file" class="tab-content">
        <h3>Project Files</h3>
        <button class="action-btn btn-grey" onclick="downloadJSON()">Save Project (JSON)</button>

        <hr>

        <label>Base Path</label> <input type="text" id="base-path" value="/d/domain/new_area/" oninput="exportSettings.basePath=this.value">
        <label>Base Level</label> <input type="number" id="base-level" value="5" oninput="exportSettings.baseLevel=this.value">
        <button class="action-btn btn-red" style="margin-top:15px;" onclick="exportLPC()">Export .zip (LPC)</button>
    </div>
</div>

<div id="canvas-container">
    <canvas id="mapCanvas"></canvas>
</div>

    function getAlignLabel(val) {
        val = parseInt(val);
        let closest = ALIGN_KEYS.reduce((prev, curr) => Math.abs(curr - val) < Math.abs(prev - val) ? curr : prev);
        return ALIGN_MAP[closest];
    }

    /* --- STRING WRAPPING LOGIC --- */
    function formatLPC(fnName, text, indentLevel = 1) {
        if (!text) return "";
        const indent = "    ".repeat(indentLevel);
        const words = text.replace(/[\r\n]+/g, ' ').trim().split(/\s+/);
        let lines = [];
        let currentLine = "";

        words.forEach(word => {
            if (currentLine.length + word.length + 1 > 70) {
                lines.push(currentLine);
                currentLine = word + " ";
            } else {
                currentLine += word + " ";
            }
        });
        if (currentLine.trim().length > 0) lines.push(currentLine);

        if (lines.length === 0) return `${indent}${fnName}("");`;
        if (lines.length === 1) return `${indent}${fnName}("${lines[0].trim()}");`;

        const formattedLines = lines.map((line, i) => {
            const isFirst = i === 0;
            const isLast = i === lines.length - 1;
            const content = isLast ? line.trim() : line;
            const prefix = isFirst ? `"` : `${indent}  "`;
            const suffix = isLast ? `");` : `"`;
            return prefix + content + suffix;
        }).join('\n');

        return `${indent}${fnName}(${formattedLines}`;
    }

    /* --- STATE --- */
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let rooms = [];
    let links = [];
    let objectLibrary = [];
    let monsterLibrary = []; 
    let activeRoom = null;
    let currentZ = 0;
    let camera = { x: 0, y: 0 };
    let isPanning = false, lastMouse = { x: 0, y: 0 };
    let zoom = 1;
    let draggingRoom = null, dragStartMouse = null, dragOrigin = null, dragMoved = false;
    let exportSettings = { areaName: "new_area", basePath: "/d/domain/new_area/", baseLevel: 5 };
    
    // Modal Context
    let currentEditType = null, currentEditId = null, currentEditLink = null; 

    /* --- DIGGING --- */
    window.dig = function(dir) {
        if(!activeRoom) return;
        let tx = activeRoom.x, ty = activeRoom.y, tz = activeRoom.z;
        const G = 60;
        switch(dir) {
            case 'n': ty -= G; break; case 's': ty += G; break;
            case 'e': tx += G; break; case 'w': tx -= G; break;
            case 'ne': tx+=G; ty-=G; break; case 'nw': tx-=G; ty-=G; break;
            case 'se': tx+=G; ty+=G; break; case 'sw': tx-=G; ty+=G; break;
            case 'up': tz++; break; case 'down': tz--; break;
        }
        let target = rooms.find(r => r.x==tx && r.y==ty && r.z==tz);
        if(!target) target = createRoom(tx, ty, tz, "New Room");
        if(!links.find(l => (l.from==activeRoom.id && l.to==target.id) || (l.from==target.id && l.to==activeRoom.id))) {
            links.push({from:activeRoom.id, to:target.id, door: {active:false}});
        }
        activeRoom = target; currentZ = tz;
        syncUI();
    };

    function deleteRoom() {
        if(!activeRoom || rooms.length<=1 || !confirm("Delete Room?")) return;
        links = links.filter(l => l.from!==activeRoom.id && l.to!==activeRoom.id);
        rooms = rooms.filter(r => r.id!==activeRoom.id);
        activeRoom = rooms[0]; currentZ=activeRoom.z;
        syncUI();
    }

    function createRoom(x, y, z, name) {
        const r = { id: Date.now()+Math.random(), x, y, z, name, longDesc: "A generic room.", terrain: "indoor", comments: "", details: [], monsters: [], objects: [] };
        migrateRoom(r);
        rooms.push(r);
        return r;
    }

    /* --- BACKWARD-COMPAT MIGRATION HELPERS --- */
    function migrateObject(obj) {
        if(obj.levelAdj === undefined) obj.levelAdj = 0;
        if(obj.keyId === undefined) obj.keyId = "";
        if(obj.weightAdj === undefined) obj.weightAdj = 0;
        if(obj.valueAdj === undefined) obj.valueAdj = 0;
        if(obj.questItem === undefined) obj.questItem = false;
        // Weapon-specific
        if(obj.ac === undefined) obj.ac = 0;
        if(obj.skillLevel === undefined) obj.skillLevel = 0;
        if(obj.decayRate === undefined) obj.decayRate = 0;
        if(obj.poisoned === undefined) obj.poisoned = false;
        if(obj.poisonAmount === undefined) obj.poisonAmount = 10;
        if(obj.wieldMsg === undefined) obj.wieldMsg = "";
        if(obj.unwieldMsg === undefined) obj.unwieldMsg = "";
        // Armour-specific
        if(obj.acAdj === undefined) obj.acAdj = 0;
        if(obj.raceOverride === undefined) obj.raceOverride = "";
        if(obj.wearMsg === undefined) obj.wearMsg = "";
        if(obj.removeMsg === undefined) obj.removeMsg = "";
        // Container/Bag-specific
        if(obj.maxCapacity === undefined) obj.maxCapacity = 200;
        if(obj.closeable === undefined) obj.closeable = true;
        if(obj.startsClosed === undefined) obj.startsClosed = true;
        if(obj.lockable === undefined) obj.lockable = false;
        if(obj.contKeyObjId === undefined) obj.contKeyObjId = "";
        if(obj.startsLocked === undefined) obj.startsLocked = false;
        if(obj.closedLong === undefined) obj.closedLong = "";
        if(obj.openString === undefined) obj.openString = "";
        if(obj.contMsg === undefined) obj.contMsg = "";
    }

    function migrateRoom(r) {
        if(r.light === undefined) r.light = 1;
        if(r.nightLight === undefined) r.nightLight = "";
        if(r.path === undefined) r.path = 0;
        if(r.combatModifier === undefined) r.combatModifier = 0;
        if(r.height === undefined) r.height = 0;
        if(r.noPick === undefined) r.noPick = false;
        if(r.noPickMsg === undefined) r.noPickMsg = "";
        if(r.atmos === undefined) r.atmos = { active:false, chance:20, sequential:false, messages:[] };
        if(r.fishing === undefined) r.fishing = { active:false, maxFishing:5, chance:4, maxCatch:5, fish:[] };
        if(r.stable === undefined) r.stable = { active:false, horses:[], currency:"", allowed:"", disallowed:"" };
        if(!Array.isArray(r.objects)) r.objects = [];
        if(!Array.isArray(r.monsters)) r.monsters = [];
        r.objects = r.objects.map(o => (o && typeof o === 'object') ? o : { id:o, msg:"" });
        r.monsters = r.monsters.map(m => (m && typeof m === 'object') ? m : { id:m, msg:"" });
    }

    function migrateLink(l) {
        if(!l.door) return;
        const d = l.door;
        if(d.id === undefined) d.id = "door";
        if(d.state === undefined) d.state = "closed";
        if(d.keyObjId === undefined) {
            if(d.key) {
                let existing = objectLibrary.find(o => o.type === 'key' && o.keyId === d.key);
                if(!existing) {
                    createObjectDef(d.key, "a " + d.key, "key", "");
                    existing = objectLibrary[objectLibrary.length - 1];
                    existing.keyId = d.key;
                }
                d.keyObjId = existing.id;
            } else {
                d.keyObjId = "";
            }
        }
        if(d.concealed === undefined) d.concealed = false;
        if(d.msgOpen === undefined) d.msgOpen = "";
        if(d.msgClose === undefined) d.msgClose = "";
        if(d.msgLock === undefined) d.msgLock = "";
        if(d.msgUnlock === undefined) d.msgUnlock = "";
    }

    /* --- INITIALIZATION --- */
    function init() {
        window.addEventListener('resize', resize);
        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        canvas.addEventListener('wheel', onWheel, { passive: false });
        activeRoom = createRoom(0, 0, 0, "The Start");
        createObjectDef("sword", "a rusty sword", "weapon", "blade");
        createMonsterDef("guard", "a guard", "Human", "Fighter");

    }

        document.getElementById('r-name').value = activeRoom.name;
        document.getElementById('r-long').value = activeRoom.longDesc;
        document.getElementById('r-terrain').value = activeRoom.terrain;
        document.getElementById('r-path').value = activeRoom.path;
        document.getElementById('r-light').value = activeRoom.light;
        document.getElementById('r-nightlight').value = activeRoom.nightLight;

    /* --- UI UPDATES & MODALS --- */
    function showTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        refreshLists();
    }

    function refreshLists() {
        if(!activeRoom) return;
        const exitList = document.getElementById('exit-list');
        let myLinks = links.filter(l => l.from === activeRoom.id || l.to === activeRoom.id);
        let html = "";
        
        const getDir = (r1, r2) => {
            if(r2.z > r1.z) return "Up"; if(r2.z < r1.z) return "Down";
            if(r2.y < r1.y) { if(r2.x < r1.x) return "NW"; if(r2.x > r1.x) return "NE"; return "North"; }
            if(r2.y > r1.y) { if(r2.x < r1.x) return "SW"; if(r2.x > r1.x) return "SE"; return "South"; }
            return r2.x > r1.x ? "East" : "West";
        };

        myLinks.forEach(l => {
            let otherId = l.from === activeRoom.id ? l.to : l.from;
            let other = rooms.find(r => r.id === otherId);
            if(!other) return;
            let dir = getDir(activeRoom, other);
            let hasDoor = l.door && l.door.active;
            html += `<div class="exit-row"><span class="exit-dir">${dir}</span><span class="exit-dest">${other.name}</span><button class="btn-sm ${hasDoor?"btn-blue":"btn-grey"}" onclick="openDoorModal('${l.from}','${l.to}')">${hasDoor?"Door (Edit)":"Door (None)"}</button></div>`;
        });
        if(html === "") html = "<div style='padding:10px; color:#666; font-size:0.8rem; text-align:center'>No exits. Use the compass to dig.</div>";
        exitList.innerHTML = html;

        document.getElementById('detail-list').innerHTML = activeRoom.details.map((d,i) => 
            `<div class="list-item" onclick="openDetailModal(${i})"><div style="overflow:hidden; max-width:220px;"><span style="color:var(--accent); font-weight:bold; margin-right:5px; font-size:0.7rem;">[${d.type.toUpperCase()}]</span><h4 style="display:inline">${d.keywords}</h4></div><button class="btn-red btn-sm" onclick="event.stopPropagation(); activeRoom.details.splice(${i},1);refreshLists()">X</button></div>`
        ).join('');

        document.getElementById('room-obj-list').innerHTML = activeRoom.objects.map((entry,i) => {
            const o = objectLibrary.find(x=>x.id==entry.id);
            return o ? `<div class="list-item" style="cursor:default; flex-direction:column; align-items:stretch;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="pointer-events:none;">${o.short}</span>
                    <button class="btn-red btn-sm" onclick="activeRoom.objects.splice(${i},1);refreshLists()">X</button>
                </div>
                <input type="text" placeholder="Reset message (optional)" value="${entry.msg||''}" style="margin-top:4px; margin-bottom:0; font-size:0.75rem;" oninput="activeRoom.objects[${i}].msg=this.value">
            </div>` : '';
        }).join('');
        document.getElementById('room-obj-select').innerHTML = objectLibrary.map(o => `<option value="${o.id}">${o.short}</option>`).join('');
        document.getElementById('global-obj-list').innerHTML = objectLibrary.map((o,i) => `<div class="list-item" onclick="openObjectModal(${i})"><div><h4>${o.idName}</h4><span>${o.type}</span></div><button class="btn-red btn-sm" onclick="event.stopPropagation(); objectLibrary.splice(${i},1); refreshLists();">X</button></div>`).join('');
        
        document.getElementById('room-mon-list').innerHTML = activeRoom.monsters.map((entry,i) => {
            const m = monsterLibrary.find(x=>x.id==entry.id);
            return m ? `<div class="list-item" style="cursor:default; flex-direction:column; align-items:stretch;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="pointer-events:none;">${m.short}</span>
                    <button class="btn-red btn-sm" onclick="activeRoom.monsters.splice(${i},1);refreshLists()">X</button>
                </div>
                <input type="text" placeholder="Reset message (optional)" value="${entry.msg||''}" style="margin-top:4px; margin-bottom:0; font-size:0.75rem;" oninput="activeRoom.monsters[${i}].msg=this.value">
            </div>` : '';
        }).join('');
        document.getElementById('room-mon-select').innerHTML = monsterLibrary.map(m => `<option value="${m.id}">${m.short}</option>`).join('');
        document.getElementById('global-mon-list').innerHTML = monsterLibrary.map((m,i) => `<div class="list-item" onclick="openMonsterModal(${i})"><div><h4>${m.short}</h4><span>Lvl Adj: ${m.levelAdj||0} ${m.race}${m.isMount?' [Mount]':''}</span></div><button class="btn-red btn-sm" onclick="event.stopPropagation(); monsterLibrary.splice(${i},1); refreshLists();">X</button></div>`).join('');

        renderSpecialFeatures();
    }

    /* --- SPECIAL ROOM FEATURES (Atmos / Fishing / Stable) --- */
    function toggleFeature(key, checked) { activeRoom[key].active = checked; renderSpecialFeatures(); }

    function addAtmosMsg() {
        const el = document.getElementById('atmos-new-msg');
        const v = el.value.trim();
        if(v) { activeRoom.atmos.messages.push(v); renderSpecialFeatures(); }
    }
    function removeAtmosMsg(i) { activeRoom.atmos.messages.splice(i,1); renderSpecialFeatures(); }

    function addFish() {
        const n = document.getElementById('fish-name').value.trim();
        const s = parseInt(document.getElementById('fish-strength').value) || 1;
        if(n) { activeRoom.fishing.fish.push({name:n, strength:s}); renderSpecialFeatures(); }
    }
    function removeFish(i) { activeRoom.fishing.fish.splice(i,1); renderSpecialFeatures(); }

    function addStableHorse() {
        const v = document.getElementById('stable-horse-sel').value;
        if(v) { activeRoom.stable.horses.push(v); renderSpecialFeatures(); }
    }
    function removeStableHorse(i) { activeRoom.stable.horses.splice(i,1); renderSpecialFeatures(); }

    function renderSpecialFeatures() {
        if(!activeRoom) return;
        const container = document.getElementById('special-features');
        if(!container) return;
        const a = activeRoom.atmos, f = activeRoom.fishing, s = activeRoom.stable;

        let atmosMsgs = a.messages.map((m,i) => `<span class="tag-pill">${m} <span class="remove" onclick="removeAtmosMsg(${i})">x</span></span>`).join('');
        let atmosHTML = `
            <div style="background:#111; padding:8px; border:1px solid #333; margin-top:10px;">
                <label style="margin-top:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto; margin:0;" ${a.active?'checked':''} onchange="toggleFeature('atmos', this.checked)"> Atmospheric Messages</label>
                <div id="atmos-opts" style="display:${a.active?'block':'none'}; margin-top:8px;">
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1"><label>Chance (per 20s)</label><input type="number" value="${a.chance}" oninput="activeRoom.atmos.chance=parseInt(this.value)||0"></div>
                        <div style="flex:1"><label style="display:flex; align-items:center; gap:6px; margin-top:22px;"><input type="checkbox" style="width:auto; margin:0;" ${a.sequential?'checked':''} onchange="activeRoom.atmos.sequential=this.checked"> Sequential (not random)</label></div>
                    </div>
                    <label>Add Message</label>
                    <div style="display:flex; gap:5px;"><input type="text" id="atmos-new-msg" placeholder="A gust of wind swirls around you."><button class="dir-btn" onclick="addAtmosMsg()">+</button></div>
                    <div style="margin-top:5px;">${atmosMsgs || '<span style="color:#666; font-size:0.8rem;">No messages yet.</span>'}</div>
                </div>
            </div>`;

        let fishRows = f.fish.map((fi,i) => `<div class="exit-row"><span style="flex:1">${fi.name}</span><span style="width:50px; text-align:right;">${fi.strength}</span><button class="btn-red btn-sm" onclick="removeFish(${i})">X</button></div>`).join('');
        let fishHTML = `
            <div style="background:#111; padding:8px; border:1px solid #333; margin-top:10px;">
                <label style="margin-top:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto; margin:0;" ${f.active?'checked':''} onchange="toggleFeature('fishing', this.checked)"> Fishing Spot</label>
                <div id="fishing-opts" style="display:${f.active?'block':'none'}; margin-top:8px;">
                    <div style="display:flex; gap:10px;">
                        <div style="flex:1"><label>Max Fishers</label><input type="number" value="${f.maxFishing}" oninput="activeRoom.fishing.maxFishing=parseInt(this.value)||1"></div>
                        <div style="flex:1"><label>Bite Chance (1-20)</label><input type="number" value="${f.chance}" oninput="activeRoom.fishing.chance=parseInt(this.value)||1"></div>
                        <div style="flex:1"><label>Max Catch/Reset</label><input type="number" value="${f.maxCatch}" oninput="activeRoom.fishing.maxCatch=parseInt(this.value)||1"></div>
                    </div>
                    <label>Custom Fish (optional — default fish used if none added)</label>
                    <div style="display:flex; gap:5px;"><input type="text" id="fish-name" placeholder="Fish name" style="flex:2"><input type="number" id="fish-strength" placeholder="Strength" style="flex:1"><button class="dir-btn" onclick="addFish()">+</button></div>
                    <div style="margin-top:5px;">${fishRows}</div>
                </div>
            </div>`;

        const mounts = monsterLibrary.filter(m => m.isMount);
        let stableOpts = mounts.map(m => `<option value="${m.id}">${m.short}</option>`).join('');
        let stableList = s.horses.map((mid,i) => { const m = monsterLibrary.find(x=>x.id==mid); return m ? `<span class="tag-pill">${m.short} <span class="remove" onclick="removeStableHorse(${i})">x</span></span>` : ''; }).join('');
        let stableHTML = `
            <div style="background:#111; padding:8px; border:1px solid #333; margin-top:10px;">
                <label style="margin-top:0; display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto; margin:0;" ${s.active?'checked':''} onchange="toggleFeature('stable', this.checked)"> Stable</label>
                <div id="stable-opts" style="display:${s.active?'block':'none'}; margin-top:8px;">
                    <label>Horses (mark a monster "Is Mount" in the Monster Library first)</label>
                    ${mounts.length ? `<div style="display:flex; gap:5px;"><select id="stable-horse-sel">${stableOpts}</select><button class="dir-btn" onclick="addStableHorse()">+</button></div>` : `<input disabled style="background:#222; border:none;" placeholder="No mounts defined yet">`}
                    <div style="margin-top:5px;">${stableList}</div>
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <div style="flex:1"><label>Currency</label><input type="text" value="${s.currency}" placeholder="gold" oninput="activeRoom.stable.currency=this.value"></div>
                        <div style="flex:1"><label>Allowed (comma list)</label><input type="text" value="${s.allowed}" oninput="activeRoom.stable.allowed=this.value"></div>
                        <div style="flex:1"><label>Disallowed (comma list)</label><input type="text" value="${s.disallowed}" oninput="activeRoom.stable.disallowed=this.value"></div>

    function syncRoom() {
        activeRoom.name = document.getElementById('r-name').value;
        activeRoom.longDesc = document.getElementById('r-long').value;
        activeRoom.terrain = document.getElementById('r-terrain').value;
        activeRoom.path = parseInt(document.getElementById('r-path').value) || 0;
        activeRoom.light = parseInt(document.getElementById('r-light').value) || 0;
        activeRoom.nightLight = document.getElementById('r-nightlight').value;
        activeRoom.combatModifier = parseInt(document.getElementById('r-combatmod').value) || 0;
        activeRoom.height = parseInt(document.getElementById('r-height').value) || 0;
        activeRoom.noPick = document.getElementById('r-nopick').checked;
        activeRoom.noPickMsg = document.getElementById('r-nopickmsg').value;
        document.getElementById('nopick-msg-row').style.display = activeRoom.noPick ? 'block' : 'none';
        draw();
    }
    
    function openModal(title) { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('modal-title').innerText = title; }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; refreshLists(); draw(); }
    function saveModal() { closeModal(); }

    function openCommentModal() {
        currentEditType = 'comment'; openModal("Room Comments");
        document.getElementById('modal-body').innerHTML = `<p style="color:#888; font-size:0.8rem;">Comments for top of file.</p><textarea rows="10" oninput="activeRoom.comments = this.value">${activeRoom.comments}</textarea>`;
    }

    function openDoorModal(fromId, toId) {
        currentEditLink = links.find(l => (l.from == fromId && l.to == toId));
        if(!currentEditLink.door) currentEditLink.door = { active: false };
        migrateLink(currentEditLink);
        const d = currentEditLink.door; openModal("Edit Door");

        const keyOptions = objectLibrary.filter(o => o.type === 'key').map(o => `<option value="${o.id}" ${d.keyObjId==o.id?'selected':''}>${o.short}</option>`).join('');

        document.getElementById('modal-body').innerHTML = `
            <label>Has Door?</label><select id="door-active" onchange="updateDoor('active', this.value === 'true')"><option value="false" ${!d.active?'selected':''}>No</option><option value="true" ${d.active?'selected':''}>Yes</option></select>
            <div id="door-opts" style="display:${d.active?'block':'none'}">
                <label>Door ID</label><input type="text" value="${d.id}" oninput="updateDoor('id', this.value)">
                <label>State</label><select onchange="updateDoor('state', this.value)"><option value="open" ${d.state==='open'?'selected':''}>Open</option><option value="closed" ${d.state==='closed'?'selected':''}>Closed</option><option value="locked" ${d.state==='locked'?'selected':''}>Locked</option></select>
                <label>Key</label>
                <select onchange="selectDoorKey(this.value)">
                    <option value="" ${!d.keyObjId?'selected':''}>No Key</option>
                    ${keyOptions}
                    <option value="__new__">+ Create New Key...</option>
                </select>
                <label style="display:flex; align-items:center; gap:6px; margin-top:10px;"><input type="checkbox" style="width:auto; margin:0;" ${d.concealed?'checked':''} onchange="updateDoor('concealed', this.checked)"> Concealed (exit hidden while closed)</label>
                <details style="background:#111; padding:8px; border:1px solid #333; margin-top:10px;">
                    <summary style="font-size:0.7rem; color:#888; text-transform:uppercase; font-weight:700; cursor:pointer; user-select:none;">Custom Messages (optional)</summary>
                    <div style="margin-top:8px;">
                        <label>On Open</label><input type="text" value="${d.msgOpen}" oninput="updateDoor('msgOpen', this.value)">
                        <label>On Close</label><input type="text" value="${d.msgClose}" oninput="updateDoor('msgClose', this.value)">
                        <label>On Lock</label><input type="text" value="${d.msgLock}" oninput="updateDoor('msgLock', this.value)">
                        <label>On Unlock</label><input type="text" value="${d.msgUnlock}" oninput="updateDoor('msgUnlock', this.value)">
                    </div>
                </details>
            </div>`;
    }
    function updateDoor(key, val) { currentEditLink.door[key] = val; if(key === 'active') document.getElementById('door-opts').style.display = val ? 'block' : 'none'; }

    function selectDoorKey(val) {
        if(val === '__new__') {
            const base = currentEditLink.door.id || 'door';
            createObjectDef(base + " key", "a " + base + " key", "key", "");
            const obj = objectLibrary[objectLibrary.length - 1];
            obj.keyId = makeSafe(base + "_key");
            currentEditLink.door.keyObjId = obj.id;
        } else {
            currentEditLink.door.keyObjId = val;
        }
        openDoorModal(currentEditLink.from, currentEditLink.to);
        refreshLists();
    }

    function openDetailModal(idx) {
        currentEditType = 'detail'; currentEditId = idx;
        if(idx === -1) { activeRoom.details.push({ type: "look", keywords: "default", desc: "It reads: Beware." }); currentEditId = activeRoom.details.length - 1; }
        const d = activeRoom.details[currentEditId]; openModal("Edit Detail / Sense");
        document.getElementById('modal-body').innerHTML = `
            <label>Type</label><select onchange="activeRoom.details[currentEditId].type = this.value"><option value="look" ${d.type==='look'?'selected':''}>Look (Item)</option><option value="listen" ${d.type==='listen'?'selected':''}>Listen (Sound)</option><option value="smell" ${d.type==='smell'?'selected':''}>Smell (Scent)</option><option value="search" ${d.type==='search'?'selected':''}>Search</option></select>
            <label>Keywords</label><input type="text" value="${d.keywords}" oninput="activeRoom.details[currentEditId].keywords = this.value"><label>Description</label><textarea rows="6" oninput="activeRoom.details[currentEditId].desc = this.value">${d.desc}</textarea>`;
    }

    /* --- COMBAT MECHANICS --- */
    function addMechanicToMonster() {
        const m = monsterLibrary[currentEditId];
        if (!m.mechanics) m.mechanics = [];
        
        const name = document.getElementById('mech-name').value;
        const cmd = document.getElementById('mech-cmd').value;
        if (!name || !cmd) {
            alert("Name and Command are required!");
            return;
        }

        m.mechanics.push({
            name: name,
            cmd: cmd,
            priority: parseInt(document.getElementById('mech-pri').value) || 1,
            cooldown: parseInt(document.getElementById('mech-cd').value) || 2,
            initial_cooldown: parseInt(document.getElementById('mech-icd').value) || 0,
            global_cooldown: parseInt(document.getElementById('mech-gcd').value) || 0,
            condition: document.getElementById('mech-cond').value || "",
            cast_time: parseFloat(document.getElementById('mech-cast').value) || 0,
            interrupt: document.getElementById('mech-int').checked ? 1 : 0,
            message: document.getElementById('mech-msg').value || "",
            lockout: document.getElementById('mech-lock').checked ? 1 : 0
        });

        openMonsterModal(currentEditId);
    }

    function removeMechanicFromMonster(index) {
        monsterLibrary[currentEditId].mechanics.splice(index, 1);
        openMonsterModal(currentEditId);
    }

    /* --- MONSTER MODAL --- */

        if(m.speechOut === undefined) m.speechOut = "";
        if(m.speechIn === undefined) m.speechIn = "";

        let filteredAvailSpells = availSpells.filter(s => !m.spells.includes(s));
        
        let spellOpts = filteredAvailSpells.map(s => `<option value="${s}">${s}</option>`).join('');

            : `<input disabled style="background:#222; border:none;" placeholder="No more spells available">`;

        let spellList = m.spells.map((s, i) => {

let mechanicsUI = `

                </summary>
                
                <div style="margin-top:10px;">
                    <div id="mechanics-list" style="margin-bottom: 10px;">
                        ${m.mechanics.map((mech, i) => `
                            <div class="list-item" style="flex-direction:column; align-items:flex-start; cursor:default;">
                                <div style="display:flex; justify-content:space-between; width:100%;">
                                    <span style="pointer-events:none;"><strong>${mech.name}</strong> (Cmd: <span style="color:var(--accent)">${mech.cmd}</span>)</span>

                                </div>
                                <div style="font-size:0.75rem; color:#aaa; margin-top:4px; pointer-events:none;">
                                    Pri: ${mech.priority} | CD: ${mech.cooldown}s | InitCD: ${mech.initial_cooldown}s | GCD: ${mech.global_cooldown}s | Cast: ${mech.cast_time}s
                                </div>
                                ${mech.condition ? `<div style="font-size:0.75rem; color:#8aa; pointer-events:none;">Cond: ${mech.condition}</div>` : ''}
                                ${mech.message ? `<div style="font-size:0.75rem; color:#aa8; pointer-events:none;">Msg: ${mech.message}</div>` : ''}
                            </div>
                        `).join('')}
                        ${m.mechanics.length === 0 ? '<div style="color:#666; font-size:0.8rem;">No mechanics added yet.</div>' : ''}
                    </div>
                    
<div style="background:#1a1a1a; padding:10px; border:1px solid #333; border-radius:4px;">
                        <h4 style="margin-top:0; margin-bottom:10px; color:#888;">Add New Mechanic</h4>
                        
                        <div style="display:flex; gap:5px; margin-bottom:2px;">
                            <input type="text" id="mech-name" placeholder="Name (e.g. Bone Storm)" style="flex:1">
                            <input type="text" id="mech-cmd" placeholder="Command (e.g. fear $T)" style="flex:2">
                            <input type="number" id="mech-pri" placeholder="Pri (1)" title="Priority" style="width:60px">
                        </div>
                        
                        <details style="margin-bottom:8px; font-size:0.75rem; color:#aaa;">
                            <summary style="cursor:pointer; color:var(--accent); font-weight:bold; display:inline-block; user-select:none;">
                                ⓘ View Command Target Substitutions
                            </summary>
                            <div style="background:#222; padding:8px; border:1px solid #444; border-radius:4px; margin-top:4px;">
                                <div style="display:grid; grid-template-columns: min-content 1fr; gap: 6px 15px; color:#ccc;">
                                    <strong style="color:#e67e22">$T</strong> <span>The current target</span>
                                    <strong style="color:#e67e22">$A</strong> <span>The current top of aggro <span style="color:#888">(can vary from target due to taunts)</span></span>
                                    <strong style="color:#e67e22">$a</strong> <span>The second top of aggro <span style="color:#888">(i.e. second after tank)</span></span>
                                    <strong style="color:#e67e22">$R</strong> <span>Random person from current attackers</span>
                                    <strong style="color:#e67e22">$r</strong> <span>Random person from attackers, <span style="color:#c0392b">EXCLUDING</span> the current target</span>
                                    <strong style="color:#e67e22">$H</strong> <span>The current top of Healing Done</span>
                                    <strong style="color:#e67e22">$h</strong> <span>Random attacker, <span style="color:#c0392b">EXCLUDING</span> the top of Healing Done</span>
                                    <strong style="color:#e67e22">$C</strong> <span>Custom target. <span style="color:#888">You must override query_mechanic_target() in code</span></span>
                                </div>
                            </div>
                        </details>

                        <div style="display:flex; gap:5px; margin-bottom:5px;">
                            <input type="number" id="mech-cd" placeholder="CD (s)" title="Cooldown" style="width:25%">

                            <input type="number" id="mech-gcd" placeholder="GCD (s)" title="Global Cooldown" style="width:25%">
                            <input type="number" id="mech-cast" placeholder="Cast (s)" title="Cast Time" style="width:25%">
                        </div>
                        
                        <input type="text" id="mech-cond" placeholder="Condition (e.g. query_hp() < 500)" style="margin-bottom:2px;">
                        
                        <details style="margin-bottom:8px; font-size:0.75rem; color:#aaa;">
                            <summary style="cursor:pointer; color:var(--accent); font-weight:bold; display:inline-block; user-select:none;">
                                ⓘ View Condition Examples
                            </summary>
                            <div style="background:#222; padding:8px; border:1px solid #444; border-radius:4px; margin-top:4px;">
                                <ul style="margin:0; padding-left:15px; color:#ccc; display:flex; flex-direction:column; gap:6px;">
                                    <li><code style="color:#e67e22">query_hp() < query_max_hp() / 2</code> <br><span style="color:#888">Triggers when the monster drops below 50% health.</span></li>
                                    <li><code style="color:#e67e22">query_hp() < 500</code> <br><span style="color:#888">Triggers when the monster has less than 500 HP remaining.</span></li>
                                    <li><code style="color:#e67e22">sizeof(query_attackers()) > 1</code> <br><span style="color:#888">Triggers only if fighting more than one enemy (Great for AoE abilities).</span></li>
                                    <li><code style="color:#e67e22">$1->query_hp() < 200</code> <br><span style="color:#888">The current target is passed as $1. Triggers if the target is below 200 HP (Great for 'Execute' or finishing moves).</span></li>
                                    <li><code style="color:#e67e22">random(100) < 30</code> <br><span style="color:#888">Adds a 30% chance to execute even if the cooldown is ready, adding unpredictability.</span></li>
                                </ul>
                            </div>
                        </details>

                        <input type="text" id="mech-msg" placeholder="Message on Cast (e.g. $T screams!)" style="margin-bottom:5px;">
                        
                        <div style="display:flex; gap:15px; margin-top:5px; margin-bottom: 10px;">

                                <input type="checkbox" id="mech-lock" style="width:auto; margin:0;"> No Room Lockout

					</div>
            </details>
        `;
        document.getElementById('modal-body').innerHTML = `
            <div style="display:flex; gap:10px;"><div style="flex:1"><label>ID Name</label><input type="text" value="${m.idName}" oninput="updateMon('idName', this.value)"></div><div style="flex:1"><label>Short Desc</label><input type="text" value="${m.short}" oninput="updateMon('short', this.value)"></div></div>
            <div style="display:flex; gap:10px;"><div style="flex:1"><label>Lvl Adj</label><input type="number" value="${m.levelAdj}" oninput="updateMon('levelAdj', this.value)"></div><div style="flex:1"><label>Race</label><select onchange="updateMon('race',this.value)">${['Arachnid','Artrell','Aurin','Basilisk','Bat','Bee','Beetle','Beholder','Bird','Carrion-crawler','Centaur','Centipede','Chimera','Cockatrice','Crocodile','Crustacean','Dagon','Drider','Drow','Dwarf','Elf','Equine','Equine-winged','Faerie','Fish','Frog','Giant','Gnome','Half-Elf','Halfling','Half-Orc','Human','Humanoid-tail','Insectoid','nsectoid-winged','Lizardman','Merperson','Null','Nymph','Octopus','Otyugh','Quadruped','Quadruped-winged','Ray','Reptile','Reptile-winged','Satyr','Slime','Snakeman','Snae-winged','Turtle','Worm'].map(r=>`<option ${m.race===r?'selected':''}>${r}</option>`)}</select></div><div style="flex:1"><label>Class</label><select onchange="updateMon('class',this.value)">${Object.keys(CLASS_SPELLS).map(c=>`<option ${m.class===c?'selected':''}>${c}</option>`)}</select></div></div>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" style="width:auto; margin:0;" ${m.isMount?'checked':''} onchange="updateMon('isMount', this.checked)"> Is Mount (usable in Stables)</label>
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <div class="align-container" style="margin-top:10px;"><label>Alignment</label><span id="align-lbl" class="align-val">${alignLabel} (${m.alignment})</span><input type="range" min="-1250" max="1250" step="50" value="${m.alignment}" oninput="updateAlignUI(this.value)"></div>
                </div>
                <div style="flex:1">
                    <label>Inventory</label><div style="display:flex; gap:5px;"><select id="mon-inv-sel">${invOpts}</select><button class="dir-btn" onclick="addMonInv()">+</button></div><div style="margin-bottom:10px; margin-top:5px;">${invList}</div>

            <label>Long Description</label><textarea rows="2" oninput="updateMon('long', this.value)">${m.long}</textarea>

                <label style="margin-top:0;">Class Spells / Skills</label>
                ${spellDropdown}
                <div style="margin-top:5px;">${spellList}</div>
            </div>

            ${mechanicsUI}

            <div style="background:#111; padding:8px; border:1px solid #333; margin-top:10px;">
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label style="margin-top:0;">Speech Chance (%)</label><input type="number" value="${m.speechChance}" oninput="updateMon('speechChance', this.value)"></div>
                    <div style="flex:1"><label style="margin-top:0;">Language</label><input type="text" value="${m.speechLang}" oninput="updateMon('speechLang', this.value)"></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div style="flex:1"><label>Out-of-Combat Chat (1 per line)</label><textarea rows="3" style="font-size:0.8rem; white-space: pre;" oninput="updateMon('speechOut', this.value)" placeholder="The trees whisper secrets...">${m.speechOut}</textarea></div>
                    <div style="flex:1"><label>In-Combat Chat (1 per line)</label><textarea rows="3" style="font-size:0.8rem; white-space: pre;" oninput="updateMon('speechIn', this.value)" placeholder="Die, intruder!">${m.speechIn}</textarea></div>
                </div>
            </div>
            `;
    }
    
    function createMonsterDef(idName, short, race, cls) { 
        monsterLibrary.push({ id: Date.now()+Math.random(), idName, short, long: `A ${race.toLowerCase()}.`, race, class: cls, levelAdj: 0, gender: "neuter", alignment: 0, inventory: [], spells: [], mechanics: [], speechOut: "", speechIn: "", speechChance: 5, speechLang: "common" }); 
    }
    function updateAlignUI(val) { val = parseInt(val); monsterLibrary[currentEditId].alignment = val; document.getElementById('align-lbl').innerText = `${getAlignLabel(val)} (${val})`; }
    function updateMon(k,v) { 
        monsterLibrary[currentEditId][k]=v; 
        if(k === 'class') { monsterLibrary[currentEditId].spells = []; openMonsterModal(currentEditId); } 
    }

    // New Add/Remove Spell functions
    function addMonSpell() { 
        const v = document.getElementById('mon-spell-sel').value; 
        if(v) { 
            if(!monsterLibrary[currentEditId].spells.includes(v)) {
                monsterLibrary[currentEditId].spells.push(v); 
            }
            openMonsterModal(currentEditId); 
        } 
    }
    function removeMonSpell(i) { 
        monsterLibrary[currentEditId].spells.splice(i,1); 
        openMonsterModal(currentEditId); 
    }

    function addMonInv() { const v=document.getElementById('mon-inv-sel').value; if(v){ monsterLibrary[currentEditId].inventory.push(v); openMonsterModal(currentEditId); } }
    function removeMonInv(i) { monsterLibrary[currentEditId].inventory.splice(i,1); openMonsterModal(currentEditId); }
    function addMonToRoom() { const v=document.getElementById('room-mon-select').value; if(v){activeRoom.monsters.push({id:v, msg:""}); refreshLists(); draw();} }

        else if(obj.type === 'armour') typeSelect = `<select onchange="updateObj('subtype', this.value)">${VALID_ARMOUR_TYPES.map(t=>`<option ${obj.subtype===t?'selected':''}>${t}</option>`)}</select>`;

    function createObjectDef(idName, short, type, subtype) {
        const obj = { id: Date.now()+Math.random(), idName, short, long: `It is ${short}.`, type, subtype, material: "plate", keyId: "" };
        migrateObject(obj);
        objectLibrary.push(obj);
    }
    function updateObj(k,v) {
        objectLibrary[currentEditId][k] = v;
        if(k==='type') {
            if(v==='weapon') objectLibrary[currentEditId].subtype="blade";
            else if(v==='armour') { objectLibrary[currentEditId].subtype="helmet"; objectLibrary[currentEditId].material="plate"; }
            else if(v==='clothing') objectLibrary[currentEditId].subtype="belt";
            else objectLibrary[currentEditId].subtype="";

    function addObjToRoom() { const v=document.getElementById('room-obj-select').value; if(v){activeRoom.objects.push({id:v, msg:""}); refreshLists(); draw();} }

    /* --- MAP DRAWING --- */
    function draw() {
        if (!activeRoom || !canvas.width) return;
        ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.translate(canvas.width/2 + camera.x, canvas.height/2 + camera.y); ctx.scale(zoom, zoom);
        links.forEach(l => {
            const r1 = rooms.find(r => r.id === l.from), r2 = rooms.find(r => r.id === l.to);
            if(!r1 || !r2 || r1.z !== currentZ || r2.z !== currentZ) return;
            ctx.beginPath(); ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.moveTo(r1.x + 17, r1.y + 17); ctx.lineTo(r2.x + 17, r2.y + 17); ctx.stroke();
            if(l.door && l.door.active) { const mx = (r1.x + r2.x)/2 + 17, my = (r1.y + r2.y)/2 + 17; ctx.fillStyle = '#c0392b'; ctx.fillRect(mx-4, my-4, 8, 8); }
        });
        rooms.forEach(r => {
            if(r.z !== currentZ) return;
            ctx.fillStyle = (r === activeRoom) ? '#e67e22' : '#2c3e50'; ctx.fillRect(r.x, r.y, 35, 35);
            ctx.strokeStyle = (r === activeRoom) ? '#fff' : '#555'; ctx.lineWidth = 1; ctx.strokeRect(r.x, r.y, 35, 35);
            if(r === draggingRoom && dragMoved) { ctx.save(); ctx.strokeStyle = '#e67e22'; ctx.setLineDash([4,3]); ctx.lineWidth = 2; ctx.strokeRect(r.x-2, r.y-2, 39, 39); ctx.restore(); }
            let hasUp=false, hasDown=false; links.forEach(l => { let otherId = (l.from===r.id)?l.to:(l.to===r.id?l.from:null); if(otherId) { let o = rooms.find(x=>x.id===otherId); if(o && o.z>r.z) hasUp=true; if(o && o.z<r.z) hasDown=true; } });
            if(hasUp) { ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(r.x+25,r.y+5); ctx.lineTo(r.x+30,r.y+12); ctx.lineTo(r.x+20,r.y+12); ctx.fill(); }
            if(hasDown){ ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(r.x+25,r.y+30); ctx.lineTo(r.x+30,r.y+23); ctx.lineTo(r.x+20,r.y+23); ctx.fill(); }
            if(r.monsters.length) { ctx.fillStyle="#8e44ad"; ctx.beginPath(); ctx.arc(r.x+35,r.y,5,0,6.28); ctx.fill(); }
            if(r.objects.length) { ctx.fillStyle="#27ae60"; ctx.beginPath(); ctx.arc(r.x+35,r.y+35,5,0,6.28); ctx.fill(); }
            if(r.details.length) { ctx.fillStyle="#3498db"; ctx.beginPath(); ctx.arc(r.x,r.y+35,5,0,6.28); ctx.fill(); }
        });
        ctx.restore();
    }

    /* --- ZOOM --- */
    function setZoom(z) {
        zoom = Math.min(3, Math.max(0.3, z));
        const lbl = document.getElementById('zoom-label');
        if(lbl) lbl.innerText = Math.round(zoom * 100) + "%";
        draw();
    }
    function zoomIn() { setZoom(zoom * 1.25); }
    function zoomOut() { setZoom(zoom / 1.25); }
    function zoomReset() { setZoom(1); }
    function onWheel(e) {
        e.preventDefault();
        setZoom(zoom * (e.deltaY < 0 ? 1.1 : 0.9));
    }

    /* --- HOVER TOOLTIP --- */
    function showTooltip(room, x, y) {
        const el = document.getElementById('room-tooltip');
        if(!el) return;
        el.style.left = (x + 16) + 'px';
        el.style.top = (y + 16) + 'px';
        el.innerHTML = `<strong>${room.name}</strong>`;
        el.style.display = 'block';
    }
    function hideTooltip() {
        const el = document.getElementById('room-tooltip');
        if(el) el.style.display = 'none';
    }

    /* --- MOUSE / DRAG HANDLING --- */
    function worldPos(e) {
        const r = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - r.left - (canvas.width/2 + camera.x)) / zoom,
            y: (e.clientY - r.top - (canvas.height/2 + camera.y)) / zoom
        };
    }

    function onDown(e) {
        const p = worldPos(e);
        const clicked = rooms.find(rm => p.x>rm.x && p.x<rm.x+35 && p.y>rm.y && p.y<rm.y+35 && rm.z==currentZ);
        if(clicked) {
            draggingRoom = clicked;
            dragStartMouse = {x:e.clientX, y:e.clientY};
            dragOrigin = {x:clicked.x, y:clicked.y};
            dragMoved = false;
        } else {
            isPanning = true; lastMouse = {x:e.clientX, y:e.clientY};
        }
    }

    function onMove(e) {
        if(isPanning) { camera.x += e.clientX - lastMouse.x; camera.y += e.clientY - lastMouse.y; lastMouse = {x:e.clientX, y:e.clientY}; hideTooltip(); draw(); return; }
        if(draggingRoom) {
            const dx = (e.clientX - dragStartMouse.x) / zoom;
            const dy = (e.clientY - dragStartMouse.y) / zoom;
            if(Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
            if(dragMoved) { draggingRoom.x = dragOrigin.x + dx; draggingRoom.y = dragOrigin.y + dy; hideTooltip(); draw(); }
            return;
        }
        const p = worldPos(e);
        const hovered = rooms.find(rm => p.x>rm.x && p.x<rm.x+35 && p.y>rm.y && p.y<rm.y+35 && rm.z==currentZ);
        if(hovered) showTooltip(hovered, e.clientX, e.clientY); else hideTooltip();
    }

    function onUp(e) {
        isPanning = false;
        if(!draggingRoom) return;
        if(dragMoved) {
            const G = 60;
            const snappedX = Math.round(draggingRoom.x / G) * G;
            const snappedY = Math.round(draggingRoom.y / G) * G;
            const collision = rooms.find(rm => rm !== draggingRoom && rm.z === draggingRoom.z && rm.x === snappedX && rm.y === snappedY);
            if(collision) { draggingRoom.x = dragOrigin.x; draggingRoom.y = dragOrigin.y; }
            else { draggingRoom.x = snappedX; draggingRoom.y = snappedY; }
            draw();
        } else {
            activeRoom = draggingRoom;
            syncUI();
        }
        draggingRoom = null;
    }

    function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; draw(); }

    /* --- EXPORT GENERATION --- */
    function makeSafe(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || "unk"; }
    function getLevelStr(adj) { adj = parseInt(adj) || 0; if(adj === 0) return "BASE_LEVEL"; return adj > 0 ? `BASE_LEVEL+${adj}` : `BASE_LEVEL${adj}`; }

    // --- ASCII MAP GENERATOR ---
    function generateASCIIMap(roomMap) {
        const zLevels = [...new Set(rooms.map(r => r.z))].sort((a,b) => b - a);
        let output = "";
        const symbols = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789abcdefghijklmnopqrstuvwxyz";

        zLevels.forEach(z => {
            output += `\n=== LEVEL ${z} ===\n\n`;
            const floorRooms = rooms.filter(r => r.z === z);
            if(floorRooms.length === 0) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            floorRooms.forEach(r => {
                if(r.x < minX) minX = r.x; if(r.y < minY) minY = r.y;
                if(r.x > maxX) maxX = r.x; if(r.y > maxY) maxY = r.y;
            });

            const xOffset = Math.abs(minX);
            const yOffset = Math.abs(minY);
            const gridW = Math.ceil((maxX - minX) / 60) + 1;
            const gridH = Math.ceil((maxY - minY) / 60) + 1;
            const charW = gridW * 6 + 1;
            const charH = gridH * 3 + 1;

            let buffer = Array(charH).fill(null).map(() => Array(charW).fill(' '));

            floorRooms.forEach(r => {
                const gx = (r.x - minX) / 60;
                const gy = (r.y - minY) / 60;
                const tx = gx * 6;
                const ty = gy * 3;

                const roomName = makeSafe(r.name);
                let symbol = "*";
                const idx = floorRooms.indexOf(r);
                if(idx < symbols.length) symbol = symbols[idx];

                if(r.x === 0 && r.y === 0 && r.z === 0) {
                    buffer[ty][tx] = '['; buffer[ty][tx+1] = '+'; buffer[ty][tx+2] = ']';
                } else {
                    buffer[ty][tx] = '['; buffer[ty][tx+1] = symbol; buffer[ty][tx+2] = ']';
                }

                links.forEach(l => {
                    let other = null;
                    if(l.from === r.id) other = rooms.find(x => x.id === l.to);
                    else if(l.to === r.id) other = rooms.find(x => x.id === l.from);
                    
                    if(other && other.z === z) {
                        const dx = (other.x - r.x) / 60;
                        const dy = (other.y - r.y) / 60;

                        if(dx === 1 && dy === 0) { buffer[ty][tx+3] = '-'; buffer[ty][tx+4] = '-'; buffer[ty][tx+5] = '-'; }
                        else if(dx === 0 && dy === 1) { buffer[ty+1][tx+1] = '|'; buffer[ty+2][tx+1] = '|'; }
                        else if(dx === 1 && dy === 1) { buffer[ty+1][tx+4] = '\\'; }
                        else if(dx === -1 && dy === 1) { buffer[ty+1][tx-2] = '/'; }
                    }
                });
            });

            output += buffer.map(row => row.join('')).join('\n') + "\n\n";
            output += "Legend:\n";
            if(floorRooms.some(r => r.x==0 && r.y==0 && r.z==0)) output += "  [+] Start Room (0,0,0)\n";
            floorRooms.forEach((r, i) => {
                let sym = (i < symbols.length) ? symbols[i] : "*";
                if(!(r.x===0 && r.y===0 && r.z===0)) {
                    const fname = roomMap[r.id];
                    output += `  [${sym}] ${r.name} (${fname})\n`;
                }
            });
            output += "--------------------------------------\n";
        });

        return output;
    }

                stableInherit = "\ninherit STABLE;";
                let horseFiles = r.stable.horses.map(mid => monMap[mid] ? `MONDIR+"${monMap[mid]}"` : null).filter(Boolean).join(', ');
                stableCode += `    set_horses(({${horseFiles}}));\n`;
                if(r.stable.currency) stableCode += `    set_currency("${r.stable.currency}");\n`;
                if(r.stable.allowed) {
                    let allowedArr = r.stable.allowed.split(',').map(s=>`"${s.trim()}"`).join(',');
                    stableCode += `    set_allowed_currencies(({${allowedArr}}));\n`;
                }
                if(r.stable.disallowed) {
                    let disallowedArr = r.stable.disallowed.split(',').map(s=>`"${s.trim()}"`).join(',');
                    stableCode += `    set_disallowed_currencies(({${disallowedArr}}));\n`;
                }
            }

            let inheritLine = `inherit ROOM;${atmosInherit}${fishInherit}${stableInherit}`;
            let extraFuncs = `${atmosInit}${fishReset}`;

            f.folder("rooms").file(rMap[r.id], `${commentBlock}#include "../include/include.h"\n${inheritLine}\nvoid create() {\n    ::create();\n${formatLPC("set_short", r.name)}\n${formatLPC("set_long", r.longDesc)}\n${terrainCode}${pathCode}${lightCode}${combatCode}${heightCode}${noPickCode}${lookCode}\n${listens.join('\n')}\n${smells.join('\n')}\n${searches.join('\n')}\n${exCode}\n${doors.join('\n')}\n${mons.join('\n')}\n${objs.join('\n')}\n${atmosCode}${fishCode}${stableCode}}${extraFuncs}`);
        });

        f.folder("docs").file("map.txt", generateASCIIMap(rMap));

        const totalMonsters = rooms.reduce((acc, r) => acc + r.monsters.length, 0);
        const totalObjects = rooms.reduce((acc, r) => acc + r.objects.length, 0);
        
        const statsContent = `Project Statistics
==================
Area Name:  ${exportSettings.areaName}
Base Path:  ${exportSettings.basePath}
Base Level: ${exportSettings.baseLevel}

Counts
------
Total Rooms:        ${rooms.length}
Placed Monsters:    ${totalMonsters}
Placed Objects:     ${totalObjects}
Unique Monster Defs:${monsterLibrary.length}
Unique Object Defs: ${objectLibrary.length}
`;
        f.folder("docs").file("stats.txt", statsContent);

        saveAs(await zip.generateAsync({type:"blob"}), `${area}.zip`);
    }

    function downloadJSON() { saveAs(new Blob([JSON.stringify({ rooms, links, objectLibrary, monsterLibrary, exportSettings })],{type:'application/json'}), 'mud.json'); }
    function importData() { let i = document.createElement('input'); i.type='file'; i.onchange=e=>{ let r=new FileReader(); r.onload=ev=>{ let d=JSON.parse(ev.target.result); rooms=d.rooms; links=d.links; objectLibrary=d.objectLibrary||[]; monsterLibrary=d.monsterLibrary||[]; exportSettings=d.exportSettings||exportSettings; objectLibrary.forEach(migrateObject); rooms.forEach(migrateRoom); links.forEach(migrateLink); activeRoom=rooms[0]; currentZ=activeRoom.z; document.getElementById('area-name').value = exportSettings.areaName; document.getElementById('base-path').value = exportSettings.basePath; document.getElementById('base-level').value = exportSettings.baseLevel; syncUI(); }; r.readAsText(e.target.files[0]); }; i.click(); }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
</script>
</body>
</html>
